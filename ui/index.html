<style>

  --g900:#064e3b;--g700:#047857;--g500:#10b981;--g400:#34d399;--g100:#d1fae5;--g50:#ecfdf5;
  --white:#fff;--gray50:#f9fafb;--gray100:#f3f4f6;--gray200:#e5e7eb;--gray300:#d1d5db;
  --gray400:#9ca3af;--gray500:#6b7280;--gray700:#374151;--gray900:#111827;
  --red50:#fef2f2;--red300:#fca5a5;--red600:#dc2626;
  --sans:'IBM Plex Sans',sans-serif;--mono:'IBM Plex Mono',monospace;
  --rsm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
}
html.dark{
  --white:#1e293b;--gray50:#0f172a;--gray100:#1e293b;--gray200:#334155;
  --gray300:#475569;--gray400:#64748b;--gray500:#94a3b8;--gray700:#cbd5e1;--gray900:#f1f5f9;
  --red50:#2d1516;--red300:#f87171;--red600:#f87171;
  --g50:#022c22;--g100:#064e3b;
  --rsm:0 1px 3px rgba(0,0,0,.3),0 1px 2px rgba(0,0,0,.2);
}
html,body,#root{height:100%}
body{font-family:var(--sans);background:var(--gray50);color:var(--gray900);-webkit-font-smoothing:antialiased}

::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gray200);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--gray400)}

@keyframes pulse    {0%,100%{opacity:1}50%{opacity:.35}}

/* ════════════════════════════════════════
   LOGIN SCREEN
════════════════════════════════════════ */
function LoginScreen({onLogin,dark,toggleDark}){
  const [user,   setUser]  = useState("");
  const [pass,   setPass]  = useState("");
  const [show,   setShow]  = useState(false);
  const [err,    setErr]   = useState("");
  const [loading,setLoad]  = useState(false);

  const submit = async(e)=>{
    e.preventDefault();
    if(!user||!pass){ setErr("Username dan password wajib diisi."); return; }
    setLoad(true); setErr("");
    try{
      const r = await fetch("/api/login",{
        method:"POST",
        headers:{"Authorization":"Basic "+btoa(`${user}:${pass}`)},
      });
      if(r.ok){
        const d = await r.json();
        onLogin({user, pass, model:d.model||"-"});
      } else {
        const d = await r.json().catch(()=>({}));
        setErr(d.detail||"Login gagal.");
      }
    }catch{
      setErr("Tidak dapat terhubung ke server. Pastikan backend sudah berjalan.");
    }
    setLoad(false);
  };

  const fieldStyle = {
    width:"100%", border:"1.5px solid var(--gray200)", borderRadius:10,
    padding:"11px 14px", fontSize:14, color:"var(--gray900)",
    background:"var(--gray50)", outline:"none",
    transition:"border .15s,box-shadow .15s", fontFamily:"var(--sans)",
  };
  const focusField  = e=>{ e.target.style.borderColor="var(--g400)"; e.target.style.boxShadow="0 0 0 3px rgba(16,185,129,.12)"; };
  const blurField   = e=>{ e.target.style.borderColor="var(--gray200)"; e.target.style.boxShadow="none"; };

  return (
    <div style={{
      minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center",
      padding:"24px",
      background:"linear-gradient(135deg,var(--g900) 0%,var(--g700) 45%,#065f46 100%)",
      backgroundSize:"200% 200%", animation:"bgShift 8s ease infinite",
    }}>
      {/* dark mode toggle */}
      <button onClick={toggleDark} title={dark?"Mode Terang":"Mode Gelap"} style={{
        position:"fixed",top:18,right:18,zIndex:10,
        display:"flex",alignItems:"center",justifyContent:"center",
        width:38,height:38,borderRadius:9,cursor:"pointer",
        background:"rgba(255,255,255,.15)",backdropFilter:"blur(8px)",
        border:"1px solid rgba(255,255,255,.25)",color:"white",transition:"background .15s"}}>
        {dark ? <IcoSun/> : <IcoMoon/>}
      </button>

      {/* grid overlay */}
      <div style={{position:"fixed",inset:0,pointerEvents:"none",opacity:.06,
        backgroundImage:"linear-gradient(white 1px,transparent 1px),linear-gradient(90deg,white 1px,transparent 1px)",
        backgroundSize:"36px 36px"}}/>

      <div style={{
        background:"var(--white)", borderRadius:20, padding:"44px 40px",
        width:"100%", maxWidth:400,
        boxShadow:"0 28px 64px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.08)",
        animation:"loginIn .5s cubic-bezier(.22,1,.36,1) both",
        position:"relative",
      }}>
        {/* logo */}
        <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:32}}>
          <div style={{
            width:48,height:48,borderRadius:14,flexShrink:0,
            background:"linear-gradient(135deg,var(--g700),var(--g500))",
            display:"flex",alignItems:"center",justifyContent:"center",
            boxShadow:"0 6px 18px rgba(16,185,129,.38)",
          }}>
            <IcoShield s={22}/>
          </div>
          <div>
            <div style={{fontWeight:700,fontSize:20,color:"var(--gray900)",letterSpacing:"-.4px"}}>SOCA</div>
            <div style={{fontSize:11,color:"var(--gray400)",fontFamily:"var(--mono)",letterSpacing:".6px",marginTop:1}}>
              SECURITY OPERATIONS CENTER
            </div>
          </div>
        </div>

        <h2 style={{fontSize:17,fontWeight:600,color:"var(--gray900)",marginBottom:4}}>Masuk ke sistem</h2>
        <p style={{fontSize:13,color:"var(--gray500)",marginBottom:28}}>
          Masukkan kredensial SOC PUSDATIN untuk melanjutkan.
        </p>

        <form onSubmit={submit} style={{display:"flex",flexDirection:"column",gap:18}}>
          {/* username */}
          <div>
            <label style={{display:"block",fontSize:12,fontWeight:500,color:"var(--gray700)",marginBottom:7,letterSpacing:".3px"}}>
              Username
            </label>
            <input value={user} onChange={e=>setUser(e.target.value)}
              placeholder="Masukkan username" autoComplete="username" autoFocus
              style={fieldStyle} onFocus={focusField} onBlur={blurField}/>
          </div>

          {/* password */}
          <div>
            <label style={{display:"block",fontSize:12,fontWeight:500,color:"var(--gray700)",marginBottom:7,letterSpacing:".3px"}}>
              Password
            </label>
            <div style={{position:"relative",display:"flex",alignItems:"center"}}>
              <input value={pass} onChange={e=>setPass(e.target.value)}
                type={show?"text":"password"} placeholder="Masukkan password"
                autoComplete="current-password"
                style={{...fieldStyle, padding:"11px 44px 11px 14px"}}
                onFocus={focusField} onBlur={blurField}/>
              <button type="button" onClick={()=>setShow(s=>!s)} style={{
                position:"absolute",right:12,background:"none",border:"none",
                cursor:"pointer",color:"var(--gray400)",display:"flex",padding:2,
              }}>
                {show ? <IcoEyeOff/> : <IcoEye/>}
              </button>
            </div>
          </div>

          {/* error */}
          {err && (
            <div style={{background:"var(--red50)",border:"1px solid var(--red300)",
              borderRadius:9,padding:"10px 14px",fontSize:13,color:"var(--red600)",
              display:"flex",alignItems:"center",gap:8}}>
              <Ico d="M18 6L6 18M6 6l12 12" s={14} c="var(--red600)"/>
              {err}
            </div>
          )}

          <button type="submit" disabled={loading} style={{
            background:loading?"var(--gray100)":"linear-gradient(135deg,var(--g700),var(--g500))",
            color:loading?"var(--gray400)":"var(--white)",
            border:"none",borderRadius:11,padding:"13px",fontSize:15,fontWeight:600,
            cursor:loading?"not-allowed":"pointer",transition:"all .2s",
            boxShadow:loading?"none":"0 4px 16px rgba(16,185,129,.32)",
            display:"flex",alignItems:"center",justifyContent:"center",gap:9,marginTop:2,
          }}>
            {loading ? (
              <>
                <div style={{width:16,height:16,border:"2px solid var(--gray300)",
                  borderTopColor:"var(--gray500)",borderRadius:"50%",animation:"spin .7s linear infinite"}}/>
                Memverifikasi...
              </>
            ) : "Masuk"}
          </button>
        </form>

        <p style={{marginTop:24,fontSize:11,color:"var(--gray400)",textAlign:"center",lineHeight:1.6}}>
          PUSDATIN Kementerian Pertanian &nbsp;·&nbsp; SOC Assistant
        </p>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   CHAT UI
════════════════════════════════════════ */
function Avatar({bot}){
  return (
    <div style={{width:30,height:30,borderRadius:"50%",flexShrink:0,
      background:bot?"linear-gradient(135deg,var(--g700),var(--g500))":"var(--gray200)",
      display:"flex",alignItems:"center",justifyContent:"center",
      boxShadow:bot?"0 2px 8px rgba(16,185,129,.28)":"none",
      fontSize:12,fontWeight:600,color:bot?"var(--white)":"var(--gray500)"}}>
      {bot ? <IcoShield s={14}/> : <span>U</span>}
    </div>
  );
}

function Bubble({msg}){
  const isUser = msg.role==="user";
  // Tombol salin hanya untuk balasan bot — analis SOC sering perlu menempelkan
  // hasil analisis ke laporan insiden. Label berubah sesaat jadi "Tersalin"
  // sebagai umpan balik, lalu kembali otomatis setelah 1,6 detik.
  const [salin,setSalin] = useState(false);
  const doSalin = ()=>{
    navigator.clipboard?.writeText(msg.text).then(()=>{
      setSalin(true);
      setTimeout(()=>setSalin(false),1600);
    }).catch(()=>{});
  };
  return (
    <div style={{display:"flex",flexDirection:isUser?"row-reverse":"row",
      alignItems:"flex-start",gap:9,animation:"fadeUp .28s ease both"}}>
      {!isUser && <Avatar bot/>}
      <div style={{maxWidth:"72%",display:"flex",flexDirection:"column",
        alignItems:isUser?"flex-end":"flex-start",gap:3}}>
        <div style={{
          background:isUser?"linear-gradient(135deg,var(--g700),var(--g500))":"var(--white)",
          color:isUser?"var(--white)":"var(--gray900)",
          border:isUser?"none":"1.5px solid var(--gray200)",
          borderRadius:isUser?"15px 15px 4px 15px":"15px 15px 15px 4px",
          padding:"11px 15px",fontSize:14,lineHeight:1.65,
          whiteSpace:"pre-wrap",wordBreak:"break-word",
          boxShadow:isUser?"0 3px 10px rgba(16,185,129,.22)":"var(--rsm)"}}>
          {msg.text}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:9}}>
          <span style={{fontSize:10,color:"var(--gray400)",fontFamily:"var(--mono)"}}>{msg.ts}</span>
          {!isUser && (
            <button onClick={doSalin} title="Salin jawaban"
              style={{display:"flex",alignItems:"center",gap:4,background:"none",border:"none",
                padding:0,cursor:"pointer",fontFamily:"var(--sans)",fontSize:10,
                color:salin?"var(--g500)":"var(--gray400)",transition:"color .13s"}}
              onMouseEnter={e=>{if(!salin)e.currentTarget.style.color="var(--gray700)"}}
              onMouseLeave={e=>{if(!salin)e.currentTarget.style.color="var(--gray400)"}}>
              {salin ? <IcoCheck/> : <IcoCopy/>}
              {salin ? "Tersalin" : "Salin"}
            </button>
          )}
        </div>
      </div>
      {isUser && <Avatar/>}
    </div>
  );
}

function ThinkingBubble({text}){
  return (
    <div style={{display:"flex",alignItems:"flex-start",gap:9,animation:"fadeUp .2s ease both"}}>
      <Avatar bot/>
      <div style={{background:"var(--white)",border:"1.5px solid var(--gray200)",
        borderRadius:"15px 15px 15px 4px",padding:"11px 15px",
        fontSize:13,color:"var(--gray500)",fontStyle:"italic",
        display:"flex",alignItems:"center",gap:10,boxShadow:"var(--rsm)"}}>
        <span style={{display:"flex",gap:3}}>
          {[0,1,2].map(i=>(
            <span key={i} style={{display:"inline-block",width:5,height:5,borderRadius:"50%",
              background:"var(--g400)",animation:`dotBounce 1.1s ${i*.18}s infinite`}}/>
          ))}
        </span>
        {text}
      </div>
    </div>
  );
}

/* ════════════════════════════════════════

   Tata letak dua kolom: daftar topik di kiri, isi topik terpilih di kanan.
   Hanya satu topik dirender pada satu waktu (bukan satu halaman panjang),
   supaya pembacaan lebih terarah — mirip situs dokumentasi teknis.
   Dirender menggantikan area chat; topbar tetap tampil agar analis bisa
   bolak-balik lewat tombol Panduan/Chat.
════════════════════════════════════════ */

    [<IcoLock/>,          "NIST CSF 2.0", "Kerangka kerja keamanan siber, dipakai sebagai dasar rekomendasi kontrol dan langkah mitigasi."],

      {/* ── Navigasi topik (kiri) ── */}
      <aside style={{width:236,flexShrink:0,background:"var(--white)",
        borderRight:"1.5px solid var(--gray100)",overflowY:"auto",padding:"18px 10px",
        display:"flex",flexDirection:"column"}}>
        <p style={{fontSize:10,fontWeight:600,color:"var(--gray400)",letterSpacing:"1px",
          textTransform:"uppercase",marginBottom:9,paddingLeft:8}}>Daftar Isi</p>
        {TOPIK.map(t=>{
          const on = t.id===topik;
          return (
            <button key={t.id} onClick={()=>setTopik(t.id)}
              style={{width:"100%",textAlign:"left",cursor:"pointer",borderRadius:8,
                padding:"9px 10px",marginBottom:2,display:"flex",alignItems:"center",gap:9,
                fontFamily:"var(--sans)",transition:"all .13s",
                border:"none",
                borderLeft:`2.5px solid ${on?"var(--g500)":"transparent"}`,
                background:on?"var(--g50)":"none",
                color:on?"var(--g700)":"var(--gray500)"}}
              onMouseEnter={e=>{if(!on){e.currentTarget.style.background="var(--gray100)";
                e.currentTarget.style.color="var(--gray700)"}}}
              onMouseLeave={e=>{if(!on){e.currentTarget.style.background="none";
                e.currentTarget.style.color="var(--gray500)"}}}>
              <span style={{color:on?"var(--g500)":"var(--gray400)",flexShrink:0,display:"flex"}}>{t.ikon}</span>
              <span style={{fontSize:12.5,fontWeight:on?600:500}}>{t.label}</span>
            </button>
          );
        })}

        {/* Identitas dokumen, konvensi umum situs dokumentasi */}
        <div style={{marginTop:"auto",paddingTop:14,paddingLeft:10,paddingRight:10,
          borderTop:"1px solid var(--gray100)"}}>
          <p style={{fontSize:10.5,color:"var(--gray400)",lineHeight:1.7}}>
            <strong style={{color:"var(--gray500)"}}>SOCA</strong> v1.0<br/>
            Panduan Penggunaan SOCA
          </p>
        </div>
      </aside>

      {/* ── Isi topik (kanan) ── */}
      <div style={{flex:1,overflowY:"auto",background:"var(--gray50)"}}>
        <div key={topik} style={{maxWidth:780,padding:"32px 42px 60px",animation:"fadeUp .3s ease"}}>

          {/* Breadcrumb */}
          <p style={{fontSize:11,color:"var(--gray400)",fontFamily:"var(--mono)",marginBottom:9}}>
            Panduan <span style={{margin:"0 6px"}}>/</span>
            <span style={{color:"var(--g700)"}}>{aktif.label}</span>
          </p>

          {/* Judul topik */}
          <h1 style={{fontSize:25,fontWeight:700,color:"var(--gray900)",
            letterSpacing:"-.5px",marginBottom:7}}>{aktif.label}</h1>
          <p style={{fontSize:13.5,color:"var(--gray500)",lineHeight:1.7,
            paddingBottom:20,marginBottom:24,borderBottom:"1.5px solid var(--gray200)"}}>{aktif.sub}</p>

          {/* Isi */}
          {KONTEN[topik]}

          {/* Navigasi sebelumnya / berikutnya */}
          <div style={{display:"flex",gap:10,marginTop:34,paddingTop:20,
            borderTop:"1.5px solid var(--gray200)"}}>
            {idxAktif>0 && (
              <button onClick={()=>setTopik(TOPIK[idxAktif-1].id)}
                style={{...CARD,flex:1,cursor:"pointer",textAlign:"left",
                  fontFamily:"var(--sans)",transition:"all .13s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--g400)"}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--gray200)"}}>
                <div style={{fontSize:10.5,color:"var(--gray400)",marginBottom:3,
                  textTransform:"uppercase",letterSpacing:".7px"}}>Sebelumnya</div>
                <div style={{fontSize:13,fontWeight:600,color:"var(--g700)"}}>{TOPIK[idxAktif-1].label}</div>
              </button>
            )}
            {idxAktif<TOPIK.length-1 && (
              <button onClick={()=>setTopik(TOPIK[idxAktif+1].id)}
                style={{...CARD,flex:1,cursor:"pointer",textAlign:"right",
                  fontFamily:"var(--sans)",transition:"all .13s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--g400)"}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--gray200)"}}>
                <div style={{fontSize:10.5,color:"var(--gray400)",marginBottom:3,
                  textTransform:"uppercase",letterSpacing:".7px"}}>Berikutnya</div>
                <div style={{fontSize:13,fontWeight:600,color:"var(--g700)"}}>{TOPIK[idxAktif+1].label}</div>
              </button>
            )}
          </div>

        </div>
      </div>
    </div>
  );
}

function ChatApp({auth,onLogout,dark,toggleDark}){
  const [msgs,   setMsgs]  = useState([{role:"bot",
    text:"Selamat datang di SOCA!\nSaya siap membantu analisis log keamanan Wazuh.\nTanyakan apa saja atau gunakan quick command di samping.",
    ts:now()}]);
  const [input,  setInput] = useState("");
  const [status, setStat]  = useState("connecting");
  const [logCnt, setLogs]  = useState(0);
  const [thinking,setThink]= useState(null);
  // "chat" | "panduan" — koneksi WebSocket & riwayat chat TIDAK direset saat
  // berpindah halaman, karena keduanya dirender di dalam komponen yang sama.
  const [page,   setPage]  = useState("chat");
  const wsRef  = useRef(null);
  const bottom = useRef(null);
  const inputEl= useRef(null);

  useEffect(()=>{
    const proto = location.protocol==="https:"?"wss":"ws";
    const url   = `${proto}://${location.host}/ws/chat`;
    const ws    = new WebSocket(url);
    wsRef.current = ws;
    ws.onopen  = ()=>{
      ws.send(JSON.stringify({type:"auth",u:auth.user,p:auth.pass}));
      setStat("open");
      fetchMeta();
    };
    ws.onclose = ()=>setStat("closed");
    ws.onerror = ()=>setStat("error");
    ws.onmessage = e=>{
      const d  = JSON.parse(e.data);
      const m  = d.message||"";
      // Semua pesan status/loading → tampilkan sebagai ThinkingBubble (animasi dots)
      // bukan sebagai chat bubble biasa
      const THINKING_KEYS = [
        "Mencari konteks",
        "Menyusun jawaban",
        "Memuat ulang",
        "Mengambil log",
        "Trigger sync",
        "Menghapus semua log",
        "Mengklasifikasi",
        "Memproses",
        "Menganalisis seluruh log",
        "Menyusun laporan analisis",
      ];
      const th = THINKING_KEYS.some(k=>m.includes(k));
      if(th){ setThink(m); }
      else  {
        setThink(null);
        setMsgs(p=>[...p,{role:"bot",text:m,ts:now()}]);
        // Auto-refresh log count setelah operasi data selesai
        if(["selesai","berhasil dihapus","Total di Qdrant","log baru"].some(k=>m.includes(k))){
          fetchMeta();
        }
      }
    };
    return ()=>ws.close();
  },[auth]);

  const fetchMeta = async()=>{
    try{
      const r = await fetch("/health",{headers:{"Authorization":"Basic "+btoa(`${auth.user}:${auth.pass}`)}});
      if(r.ok){ const d=await r.json(); setLogs(d.logs_indexed||0); }
    }catch{}
  };

  useEffect(()=>{ bottom.current?.scrollIntoView({behavior:"smooth"}); },[msgs,thinking]);

  const send = useCallback((txt)=>{
    const t=(txt||input).trim();
    if(!t||status!=="open") return;
    if(t==="/clear"||t==="/clear_chat"){ setMsgs([{role:"bot",text:"Riwayat chat dibersihkan.",ts:now()}]); setInput(""); return; }
    setMsgs(p=>[...p,{role:"user",text:t,ts:now()}]);
    wsRef.current.send(t);
    setInput(""); inputEl.current?.focus();
  },[input,status]);

  const CMDS=[
    {label:"/help",        icon:<IcoInfo/>,    desc:"Panduan"},
    {label:"/stat",        icon:<IcoZap/>,     desc:"Status & auto-sync"},
    {label:"/set days 7",  icon:<IcoTerm/>,    desc:"Log 7 hari"},
    {label:"/reload",      icon:<IcoRefresh/>, desc:"Muat log N hari"},
    {label:"/sync",        icon:<IcoSync/>,    desc:"Sync log baru sekarang"},
    {label:"/clear_chat",  icon:<IcoClear/>,   desc:"Bersihkan chat"},
    {label:"/clear_logs",  icon:<IcoTrash/>,   desc:"Hapus semua log"},
    {label:"/full_analyze",icon:<IcoShield s={13}/>, desc:"Laporan lengkap semua log"},
  ];

  const DOT={
    connecting:{c:"#f59e0b", l:"Menghubungkan"},
    open:      {c:"var(--g500)",l:"Terhubung"},
    closed:    {c:"var(--gray400)",l:"Terputus"},
    error:     {c:"#ef4444",l:"Error"},
  };
  const dot = DOT[status]||DOT.error;
  const canSend = status==="open"&&input.trim();

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"var(--gray50)"}}>

      {/* TOPBAR */}
      <header style={{background:"var(--white)",borderBottom:"1.5px solid var(--gray100)",
        padding:"0 22px",height:58,display:"flex",alignItems:"center",gap:14,flexShrink:0,
        boxShadow:"var(--rsm)"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:9,flexShrink:0,
            background:"linear-gradient(135deg,var(--g700),var(--g500))",
            display:"flex",alignItems:"center",justifyContent:"center",
            boxShadow:"0 2px 8px rgba(16,185,129,.28)"}}>
            <IcoShield s={17}/>
          </div>
          <div>
            <span style={{fontWeight:700,fontSize:15,color:"var(--gray900)",letterSpacing:"-.3px"}}>SOCA</span>
            <span style={{fontSize:11,color:"var(--gray400)",fontFamily:"var(--mono)",marginLeft:8}}>SOC ASSISTANT</span>
          </div>
        </div>

        <div style={{display:"flex",gap:5,marginLeft:4}}>
          {["NIST CSF 2.0","MITRE ATT&CK","Wazuh"].map(t=>(
            <span key={t} style={{background:"var(--g50)",color:"var(--g700)",
              border:"1px solid var(--g100)",borderRadius:99,padding:"2px 9px",fontSize:11,fontWeight:500}}>{t}</span>
          ))}
        </div>

        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:16}}>
          <span style={{fontSize:12,color:"var(--gray500)",fontFamily:"var(--mono)",display:"flex",alignItems:"center",gap:5}}>
            <IcoZap/>{auth.model}
          </span>
          <span style={{fontSize:12,color:"var(--gray500)",display:"flex",alignItems:"center",gap:5}}>
            <IcoTerm/>{logCnt.toLocaleString()} log
          </span>
          <span style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{width:8,height:8,borderRadius:"50%",background:dot.c,flexShrink:0,
              boxShadow:status==="open"?`0 0 0 3px ${dot.c}33`:"none",
              animation:status==="connecting"?"pulse 1.2s infinite":"none"}}/>
            <span style={{fontSize:12,color:dot.c,fontWeight:500}}>{dot.l}</span>
          </span>
          <button onClick={toggleDark} title={dark?"Mode Terang":"Mode Gelap"} style={{
            display:"flex",alignItems:"center",justifyContent:"center",
            width:34,height:34,background:"none",
            border:"1.5px solid var(--gray200)",borderRadius:8,
            color:"var(--gray500)",cursor:"pointer",transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.background="var(--gray100)";e.currentTarget.style.color="var(--gray700)"}}
            onMouseLeave={e=>{e.currentTarget.style.background="none";e.currentTarget.style.color="var(--gray500)"}}>
            {dark ? <IcoSun/> : <IcoMoon/>}
          </button>
          {/* Toggle Panduan <-> Chat. Saat halaman panduan aktif, tombol diberi
              aksen hijau agar jelas posisi pengguna sedang di mana. */}
          <button onClick={()=>setPage(page==="chat"?"panduan":"chat")}
            title={page==="chat"?"Buka panduan penggunaan":"Kembali ke chat"}
            style={{
              display:"flex",alignItems:"center",gap:6,
              background:page==="panduan"?"var(--g50)":"none",
              border:`1.5px solid ${page==="panduan"?"var(--g100)":"var(--gray200)"}`,
              borderRadius:8,padding:"5px 12px",fontSize:12,
              color:page==="panduan"?"var(--g700)":"var(--gray500)",cursor:"pointer",
              transition:"all .15s",fontFamily:"var(--sans)",fontWeight:500}}
            onMouseEnter={e=>{e.currentTarget.style.background="var(--gray100)";e.currentTarget.style.color="var(--gray700)"}}
            onMouseLeave={e=>{e.currentTarget.style.background=page==="panduan"?"var(--g50)":"none";
              e.currentTarget.style.color=page==="panduan"?"var(--g700)":"var(--gray500)"}}>
            {page==="chat" ? <React.Fragment><IcoBook/>Panduan</React.Fragment>
                           : <React.Fragment><IcoChat/>Chat</React.Fragment>}
          </button>
          <button onClick={onLogout} style={{
            display:"flex",alignItems:"center",gap:6,background:"none",
            border:"1.5px solid var(--gray200)",borderRadius:8,
            padding:"5px 12px",fontSize:12,color:"var(--gray500)",cursor:"pointer",
            transition:"all .15s",fontFamily:"var(--sans)",fontWeight:500}}
            onMouseEnter={e=>{e.currentTarget.style.background="var(--gray100)";e.currentTarget.style.color="var(--gray700)"}}
            onMouseLeave={e=>{e.currentTarget.style.background="none";e.currentTarget.style.color="var(--gray500)"}}>
            <IcoLogout/>Keluar
          </button>
        </div>
      </header>

      {/* BODY — halaman panduan menggantikan area chat, topbar tetap tampil.
          Contoh pertanyaan yang diklik akan memindahkan ke chat lalu mengirimnya
          (jeda singkat memberi waktu render halaman chat sebelum pesan masuk). */}
      {page==="panduan" ? (
        <PanduanPage onTryExample={(q)=>{ setPage("chat"); setTimeout(()=>send(q),80); }}/>
      ) : (
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>

        {/* sidebar */}
        <aside style={{width:210,flexShrink:0,background:"var(--white)",
          borderRight:"1.5px solid var(--gray100)",padding:"18px 12px",
          display:"flex",flexDirection:"column",gap:4}}>
          <p style={{fontSize:10,fontWeight:600,color:"var(--gray400)",letterSpacing:"1px",
            textTransform:"uppercase",marginBottom:6,paddingLeft:6}}>Quick Commands</p>
          {CMDS.map(c=>(
            <button key={c.label} onClick={()=>send(c.label)}
              style={{background:"none",border:"none",borderRadius:8,padding:"8px 10px",
                display:"flex",alignItems:"center",gap:9,cursor:"pointer",
                textAlign:"left",width:"100%",color:"var(--gray600)",transition:"all .13s"}}
              onMouseEnter={e=>{e.currentTarget.style.background="var(--g50)";e.currentTarget.style.color="var(--g700)"}}
              onMouseLeave={e=>{e.currentTarget.style.background="none";e.currentTarget.style.color="var(--gray600)"}}>
              <span style={{color:"var(--g500)",flexShrink:0}}>{c.icon}</span>
              <div>
                <div style={{fontSize:12,fontWeight:500,fontFamily:"var(--mono)"}}>{c.label}</div>
                <div style={{fontSize:10,color:"var(--gray400)",marginTop:1}}>{c.desc}</div>
              </div>
            </button>
          ))}
          <div style={{marginTop:"auto",padding:"12px 8px 0",borderTop:"1px solid var(--gray100)"}}>
            <p style={{fontSize:10,color:"var(--gray400)",lineHeight:1.65}}>
              <strong style={{color:"var(--gray600)"}}>Contoh:</strong><br/>
              <span style={{fontFamily:"var(--mono)",color:"var(--g700)",fontSize:10}}>
                Ada brute force dari IP mana?
              </span>
            </p>
          </div>
        </aside>

        {/* chat */}
        <main style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
          <div style={{flex:1,overflowY:"auto",padding:"22px 26px",display:"flex",flexDirection:"column",gap:14}}>
            {msgs.map((m,i)=><Bubble key={i} msg={m}/>)}
            {thinking && <ThinkingBubble text={thinking}/>}
            <div ref={bottom}/>
          </div>

          {/* input */}
          <div style={{background:"var(--white)",borderTop:"1.5px solid var(--gray100)",padding:"14px 26px",flexShrink:0}}>
            <div style={{display:"flex",gap:9,alignItems:"center"}}>
              <input ref={inputEl} value={input}
                onChange={e=>setInput(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
                placeholder="Tanyakan tentang log keamanan..."
                disabled={status!=="open"}
                style={{flex:1,border:"1.5px solid var(--gray200)",borderRadius:11,
                  padding:"12px 16px",fontSize:14,color:"var(--gray900)",
                  background:status!=="open"?"var(--gray50)":"var(--white)",
                  outline:"none",transition:"border .15s,box-shadow .15s",fontFamily:"var(--sans)"}}
                onFocus={e=>{e.target.style.borderColor="var(--g400)";e.target.style.boxShadow="0 0 0 3px rgba(16,185,129,.1)"}}
                onBlur={e=>{e.target.style.borderColor="var(--gray200)";e.target.style.boxShadow="none"}}
              />
              <button onClick={()=>send()} disabled={!canSend}
                style={{width:46,height:46,borderRadius:11,border:"none",flexShrink:0,
                  background:canSend?"linear-gradient(135deg,var(--g700),var(--g500))":"var(--gray100)",
                  color:canSend?"var(--white)":"var(--gray400)",
                  cursor:canSend?"pointer":"not-allowed",
                  display:"flex",alignItems:"center",justifyContent:"center",
                  boxShadow:canSend?"0 3px 10px rgba(16,185,129,.28)":"none",transition:"all .18s"}}>
                <IcoSend/>
              </button>
            </div>
            <p style={{marginTop:7,fontSize:11,color:"var(--gray400)",textAlign:"center"}}>
              Enter untuk kirim &nbsp;·&nbsp; /full_analyze laporan lengkap &nbsp;·&nbsp; /reload muat log &nbsp;·&nbsp; /sync ambil log baru &nbsp;·&nbsp; /help panduan
            </p>
          </div>
        </main>
      </div>
      )}
    </div>
  );
}

/* ════════════════════════════════════════
   ROOT
════════════════════════════════════════ */
function App(){
  const [auth,setAuth] = useState(()=>{
    try{ return JSON.parse(sessionStorage.getItem("soca_auth")); }catch{ return null; }
  });
  const [dark,setDark] = useState(()=> localStorage.getItem("soca_dark")==="1");

  useEffect(()=>{
    document.documentElement.classList.toggle("dark",dark);
    localStorage.setItem("soca_dark", dark?"1":"0");
  },[dark]);

  const toggleDark = ()=>setDark(d=>!d);
  const login  = a=>{ sessionStorage.setItem("soca_auth",JSON.stringify(a)); setAuth(a); };
  const logout = ()=>{ sessionStorage.removeItem("soca_auth"); setAuth(null); };
  return auth
    ? <ChatApp auth={auth} onLogout={logout} dark={dark} toggleDark={toggleDark}/>
    : <LoginScreen onLogin={login} dark={dark} toggleDark={toggleDark}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
